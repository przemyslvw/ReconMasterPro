name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Execute Unit Tests
      run: mvn -B test --file ReconMasterPro/pom.xml

    - name: Package Fat JAR with Maven
      run: mvn -B package --file ReconMasterPro/pom.xml

    - name: Upload Shaded Release JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reconmaster-pro-jar
        path: ReconMasterPro/target/reconmaster-pro-*-jar-with-dependencies.jar
